<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- ==================== HEADER COMPONENT ==================== -->
    <header class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 lg:px-8 py-4 flex justify-between items-center">
            <!-- Logo avec effet hover -->
            <a href="#" class="flex items-center gap-2 group">
                <div
                    class="w-8 h-8 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center shadow-md group-hover:shadow-lg transition-shadow duration-200">
                    <span class="text-white font-bold text-sm">M</span>
                </div>
                <span
                    class="text-xl font-bold bg-gradient-to-r from-blue-600 to-blue-500 bg-clip-text text-transparent">
                    MonSite
                </span>
            </a>

            <!-- Navigation avec indicateurs -->
            <nav class="flex items-center gap-1">
                <a href="#"
                    class="relative px-4 py-2 text-blue-600 font-medium rounded-lg bg-blue-50 transition-all duration-200">
                    Accueil
                </a>
                <a href="#"
                    class="px-4 py-2 text-gray-600 hover:text-blue-600 hover:bg-gray-50 font-medium rounded-lg transition-all duration-200">
                    Articles
                </a>
                <a href="#"
                    class="px-4 py-2 text-gray-600 hover:text-blue-600 hover:bg-gray-50 font-medium rounded-lg transition-all duration-200">
                    Contact
                </a>
            </nav>
        </div>
    </header>
    <!-- ==================== END HEADER ==================== -->

    <!-- Demo content -->
    <main class="max-w-6xl mx-auto p-8">
        <div class="bg-white rounded-xl shadow-md p-8 border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Preview du Header</h1>
            <p class="text-gray-600 mb-4">Scroll vers le bas pour tester le sticky avec backdrop-blur...</p>
            <div class="h-[150vh] bg-gradient-to-b from-gray-50 to-gray-100 rounded-lg"></div>
        </div>
    </main>

</body>

</html>
