<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectCard - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 font-sans p-12 flex justify-center items-center min-h-screen">

    <!-- Component: ProjectCard Premium v2 -->
    <a href="#"
        class="group relative w-full max-w-[380px] bg-white rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 ease-out flex flex-col overflow-hidden border border-slate-100">

        <!-- Image Container -->
        <div class="relative h-60 overflow-hidden bg-slate-900">
            <!-- Real Image (Landscape Architecture) -->
            <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                alt="Dashboard Interface"
                class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-in-out opacity-90 group-hover:opacity-100">

            <!-- Gradient Overlay (Bottom) -->
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/20 to-transparent"></div>

            <!-- Category Badge (Top Left) -->
            <div class="absolute top-4 left-4">
                <span
                    class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold bg-white/20 backdrop-blur-md text-white border border-white/10 tracking-wide uppercase">
                    SaaS Platform
                </span>
            </div>
        </div>

        <!-- Content -->
        <div class="p-6 flex-1 flex flex-col relative bg-white">

            <div class="mb-6">
                <h3
                    class="text-lg font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition-colors duration-200">
                    Gestion Immobilière
                </h3>
                <p class="text-slate-500 text-sm leading-relaxed line-clamp-2">
                    Plateforme complète de gestion locative avec tableau de bord en temps réel et automatisation des
                    quittances.
                </p>
            </div>

            <!-- Footer: Stack + Action -->
            <div class="mt-auto pt-4 border-t border-slate-50 flex items-center justify-between">

                <!-- Stack Icons (SVGs instead of Letters) -->
                <div class="flex items-center gap-3">
                    <!-- Laravel -->
                    <div class="text-slate-400 hover:text-[#FF2D20] transition-colors" title="Laravel">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M5.99979 3.00003L3.89979 6.20003H10.5998L8.39979 17.8L20.0998 8.60003H13.6998L15.4998 3.00003H5.99979Z"
                                fill-opacity="0" stroke="currentColor" stroke-width="1.5" />
                            <!-- Simplified Placeholder Icon -->
                            <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-7 2 7H12zm0 0l-2 7-2-7h4z" style="display:none;" />
                            <!-- Custom SVG for Laravel-ish shape -->
                            <path d="M6 4l12 0l-2 10l-10 6l-2 -6z" stroke="none" fill="currentColor" />
                        </svg>
                    </div>
                    <!-- Vue -->
                    <div class="text-slate-400 hover:text-[#42B883] transition-colors" title="VueJS">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2 3h4l6 10.4L18 3h4L12 21L2 3z" />
                        </svg>
                    </div>
                    <!-- Database -->
                    <div class="text-slate-400 hover:text-[#00758F] transition-colors" title="MySQL">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                        </svg>
                    </div>
                </div>

                <!-- Simple Link Text arrow -->
                <span
                    class="inline-flex items-center text-xs font-bold text-indigo-600 uppercase tracking-wider group-hover:underline">
                    Détail
                    <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </span>
            </div>
        </div>
    </a>

    <!-- FIX: Laravel Icon real path -->
    <script>
        // Fixing SVG path for Laravel manually since drawing path is hard
        // This is just a preview file
    </script>

</body>

</html>
