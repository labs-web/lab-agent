<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectCard - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 600: '#4F46E5', 800: '#3730A3' },
                        slate: { 50: '#F8FAFC', 200: '#E2E8F0', 500: '#64748B', 900: '#0F172A' },
                        emerald: { 500: '#10B981' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 font-sans p-8 flex justify-center">

    <!-- Component: ProjectCard -->
    <div
        class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 w-full max-w-sm overflow-hidden group">
        <!-- Image -->
        <div class="h-48 bg-slate-200 relative overflow-hidden">
            <img src="https://placehold.co/600x400/e2e8f0/64748b?text=Project+Preview" alt="Projet"
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div
                class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-semibold text-slate-700 shadow-sm">
                SaaS
            </div>
        </div>

        <!-- Content -->
        <div class="p-6">
            <h3 class="text-xl font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition-colors">
                Gestion Immobilière
            </h3>
            <p class="text-slate-500 text-sm mb-4 line-clamp-2">
                Plateforme complète de gestion locative permettant le suivi des paiements, des contrats et des incidents
                techniques.
            </p>

            <!-- Tags -->
            <div class="flex flex-wrap gap-2 mb-6">
                <span class="px-2 py-1 bg-indigo-50 text-indigo-700 text-xs rounded-md font-medium">Laravel</span>
                <span class="px-2 py-1 bg-emerald-50 text-emerald-700 text-xs rounded-md font-medium">VueJS</span>
                <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded-md font-medium">MySQL</span>
            </div>

            <!-- Link -->
            <a href="#"
                class="inline-flex items-center text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                Voir le détail
                <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                    </path>
                </svg>
            </a>
        </div>
    </div>

</body>

</html>
