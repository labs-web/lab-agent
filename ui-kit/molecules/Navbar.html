<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Navbar - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter'] }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-[300px] pt-10">

    <!-- Component: Navbar Premium (Aligned) -->
    <nav class="fixed top-6 left-0 right-0 max-w-7xl mx-auto px-6 z-50">
        <div
            class="bg-white/80 backdrop-blur-md border border-slate-200/50 rounded-2xl shadow-sm px-6 py-4 flex items-center justify-between">

            <!-- Logo -->
            <a href="#" class="text-slate-900 font-bold text-xl tracking-tight flex items-center gap-2 group">
                <span
                    class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 group-hover:scale-110 transition-transform">
                    P
                </span>
                <span class="opacity-100">Portfolio</span>
            </a>

            <!-- Desktop Links -->
            <div class="hidden md:flex items-center gap-8">
                <a href="#projects"
                    class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors relative group">
                    Projets
                    <span
                        class="absolute -bottom-1 left-0 w-0 h-0.5 bg-indigo-600 transition-all group-hover:w-full"></span>
                </a>
                <a href="#skills"
                    class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors relative group">
                    Compétences
                    <span
                        class="absolute -bottom-1 left-0 w-0 h-0.5 bg-indigo-600 transition-all group-hover:w-full"></span>
                </a>
                <a href="#"
                    class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors relative group">
                    À propos
                    <span
                        class="absolute -bottom-1 left-0 w-0 h-0.5 bg-indigo-600 transition-all group-hover:w-full"></span>
                </a>
            </div>

            <!-- CTA & Mobile Menu -->
            <div class="flex items-center gap-4">
                <a href="#contact"
                    class="hidden md:inline-flex px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/20">
                    Me contacter
                </a>

                <!-- Mobile Burger -->
                <button class="md:hidden text-slate-600 hover:text-indigo-600 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>

        </div>
    </nav>

    <!-- Context for preview -->
    <div class="pt-32 text-center text-slate-500 text-sm">
        Scroll pour voir l'effet fixed / sticky. le background est gris clair (layout).
    </div>
    <div class="h-[1000px]"></div>

</body>

</html>
