<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArticleCard - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen p-8">

    <div class="max-w-sm mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">ArticleCard</h1>

        <!-- ==================== ARTICLE CARD COMPONENT ==================== -->
        <article
            class="group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 hover:border-blue-200 transform hover:-translate-y-1">
            <!-- Image avec overlay au hover -->
            <div class="relative aspect-video bg-gradient-to-br from-gray-200 to-gray-300 overflow-hidden">
                <img src="https://picsum.photos/seed/article1/400/225" alt="Titre de l'article"
                    class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <!-- Overlay gradient -->
                <div
                    class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                </div>
            </div>

            <!-- Content -->
            <div class="p-5">
                <!-- Titre -->
                <h3
                    class="text-xl font-bold text-gray-800 mb-2 group-hover:text-blue-600 transition-colors duration-200">
                    Titre de l'article
                </h3>

                <!-- Résumé -->
                <p class="text-sm text-gray-500 line-clamp-2 mb-4 leading-relaxed">
                    Ceci est un résumé de l'article qui peut être tronqué si trop long. Il présente un aperçu du
                    contenu...
                </p>

                <!-- Footer: Date + Lien -->
                <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                    <span class="text-xs text-gray-400 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        27 Jan 2026
                    </span>
                    <a href="#"
                        class="inline-flex items-center gap-1 text-blue-500 hover:text-blue-600 font-semibold text-sm transition-colors duration-200 group/link">
                        Lire la suite
                        <svg class="w-4 h-4 transition-transform duration-200 group-hover/link:translate-x-1"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7">
                            </path>
                        </svg>
                    </a>
                </div>
            </div>
        </article>
        <!-- ==================== END ARTICLE CARD ==================== -->

    </div>

</body>

</html>
