<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Card Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8 flex justify-center">

    <!-- COMPONENT START: ArticleCard -->
    <article
        class="flex flex-col overflow-hidden rounded-lg shadow-lg bg-white w-full max-w-sm hover:shadow-xl transition-shadow duration-300 ease-in-out">
        <div class="flex-shrink-0">
            <img class="h-48 w-full object-cover"
                src="https://images.unsplash.com/photo-1496128858413-b36217c2ce36?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1679&q=80"
                alt="Article cover image">
        </div>
        <div class="flex-1 bg-white p-6 flex flex-col justify-between">
            <div class="flex-1">
                <p class="text-sm font-medium text-indigo-600">
                    <a href="#" class="hover:underline">Technologie</a>
                </p>
                <a href="#" class="block mt-2">
                    <p class="text-xl font-semibold text-gray-900">
                        L'avenir de l'IA en 2026
                    </p>
                    <p class="mt-3 text-base text-gray-500">
                        Découvrez comment les agents autonomes transforment le développement web et l'architecture
                        logicielle moderne.
                    </p>
                </a>
            </div>
            <div class="mt-6 flex items-center">
                <div class="flex-shrink-0">
                    <span class="sr-only">Auteur</span>
                    <div
                        class="h-10 w-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 font-bold">
                        JD
                    </div>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-gray-900">
                        <a href="#" class="hover:underline">Jean Dupont</a>
                    </p>
                    <div class="flex space-x-1 text-sm text-gray-500">
                        <time datetime="2026-01-27">27 Jan 2026</time>
                        <span aria-hidden="true">&middot;</span>
                        <span>5 min de lecture</span>
                    </div>
                </div>
            </div>
            <div class="mt-6">
                <a href="#"
                    class="group w-full flex items-center justify-center px-4 py-2 border border-transparent rounded-md text-sm font-semibold text-indigo-700 bg-indigo-100 hover:bg-indigo-600 hover:text-white transition-all duration-300 ease-in-out">
                    <span>Lire l'article</span>
                    <svg class="w-4 h-4 ml-2 transform group-hover:translate-x-1 transition-transform duration-300"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </a>
            </div>
        </div>
    </article>
    <!-- COMPONENT END -->

</body>

</html>
