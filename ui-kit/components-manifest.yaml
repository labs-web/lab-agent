# Manifeste des composants UI-Kit
# Ce fichier sert de source de vérité pour l'Agent et le Développeur.
# Il recense tous les composants atomiques et moléculaires disponibles.
# L'agent DOIT consulter ce fichier avant de créer un nouveau composant pour éviter les doublons.
# L'agent DOIT mettre à jour ce fichier après chaque création ou modification de composant.

meta:
  version: 1.0.0
  description: "Registre centralisé des composants UI"

components:
  - name: "PublicMenu"
    category: "Molecules"
    path: "./molecules/PublicMenu.html"
    status: "validated"
    description: "Barre de navigation principale pour le site public."
    dependencies: []

  - name: "ArticleCard"
    category: "Molecules"
    path: "./molecules/ArticleCard.html"
    status: "validated"
    description: "Carte affichant le résumé d'un article (image, titre, extrait)."
    dependencies: []

  - name: "PublicLayout"
    category: "Layouts"
    path: "./layouts/PublicLayout.html"
    status: "validated"
    description: "Layout de structure globale (Header + Main + Grille Articles + Footer)."
    dependencies: ["PublicMenu"]

  - name: "ArticleListPage"
    category: "Pages"
    path: "./pages/ArticleListPage.html"
    status: "validated"
    description: "Page complète listant les articles."
    dependencies: ["PublicLayout", "ArticleCard"]
