components:
  - name: "MainLayout"
    category: "Layouts"
    path: "./ui-kit/layouts/MainLayout.html"
    status: "pending"
    description: "Structure globale (Header + Footer + Bg)."
    dependencies: ["Navbar"]
    specs:
      visual: "Background gris clair (slate-50), Navbar sticky, Footer simple."
      elements: ["Navbar Component", "Slot Content", "Footer"]
      data: {}
      notes: "Doit servir de conteneur pour les autres composants."

  - name: "ProjectLayout"
    category: "Layouts"
    path: "./ui-kit/layouts/ProjectLayout.html"
    status: "pending"
    description: "Layout spécifique pour la grille de projets."
    dependencies: ["MainLayout", "ProjectCard"]
    specs:
      visual: "Hérite de MainLayout. Grille CSS 3 colonnes."
      elements: ["MainLayout", "Project Grid"]
      data: {}
      notes: "Démo de la grille responsive."

  - name: "Hero"
    category: "Layouts"
    path: "./ui-kit/layouts/Hero.html"
    status: "validated"
    description: "Section d'introduction avec titre, sous-titre et boutons d'action."
    dependencies: []
    specs:
      visual: "Zone Centrale : Badge 'Dev Laravel', Titre H1, Ss-titre, 2 boutons. Fond abstrait Indigo."
      elements: ["Badge", "Titre H1", "Paragraphe", "Bouton Primary", "Bouton Secondary"]
      data: 
        badge_text: "Développeur Laravel Senior"
        title: "Construisons des applications Robustes"
        cta_primary: "Voir mes projets"
        cta_secondary: "Me contacter"
      notes: "Contraste text/bg important."

  - name: "ProjectCard"
    category: "Molecules"
    path: "./ui-kit/molecules/ProjectCard.html"
    status: "validated"
    description: "Carte affichant un projet avec image, titre, description et tags."
    dependencies: []
    specs:
      visual: "Haut: Image 16/9. Centre: Badge, Titre, Desc. Bas: Tags, Link."
      elements: ["Image", "Badge Catégorie", "Titre H3", "Desc courte", "Tags (Pill)", "Lien"]
      data:
        image_url: "placeholder.jpg"
        category: "SaaS"
        title: "Gestion Immobilière"
        description: "Plateforme complète de gestion locative."
        tags: ["Laravel", "VueJS", "MySQL"]
      notes: "Shadow-hover effect requis."

  - name: "SkillBadge"
    category: "Atoms"
    path: "./ui-kit/atoms/SkillBadge.html"
    status: "validated"
    description: "Badge simple pour afficher une compétence."
    dependencies: []
    specs:
      visual: "Pill shape, background léger, texte coloré."
      elements: ["Container rounded-full", "Text"]
      data:
        name: "Laravel"
      notes: "Compact et lisible."

  - name: "Navbar"
    category: "Molecules"
    path: "./ui-kit/molecules/Navbar.html"
    status: "pending"
    description: "Menu de navigation principal responsive."
    dependencies: []
    specs:
      visual: "Logo texte à gauche, Liens au centre (Desktop), Burger (Mobile)."
      elements: ["Logo", "Links (Projets, Skills, Contact)", "CTA"]
      data: {}
      notes: "Doit être sticky et glassmorphism."

  - name: "ContactCard"
    category: "Molecules"
    path: "./ui-kit/molecules/ContactCard.html"
    status: "pending"
    description: "Affichage statique des informations de contact (Email, Réseaux)."
    dependencies: []
    specs:
      visual: "Carte ou grille avec icônes (Email, GitHub, LinkedIn). Boutons 'Copier' ou Liens."
      elements: ["Email + Copy", "Social Links", "Location"]
      data:
        email: "contact@example.com"
        github: "github.com/example"
        linkedin: "linkedin.com/in/example"
      notes: "Pas de backend. Simple et accessible."
