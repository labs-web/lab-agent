<!-- 
    Hero Component
    Arguments:
        - title: string
        - description: string
-->

<!-- Dependencies for Standalone Preview -->
<link rel="stylesheet" href="/ui-kit/base/variables.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-dark, #0f172a);
        color: var(--text-main, #fff);
        margin: 0;
        padding: 20px;
    }
</style>

<style>
    .hero {
        text-align: center;
        margin-bottom: var(--spacing-xxl);
        padding: var(--spacing-xxl) 0;
        border-bottom: 1px solid var(--glass-border);
    }

    .hero h1 {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 0.5em;
        background: linear-gradient(to right, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.02em;
        margin-top: 0;
    }

    .hero p {
        font-size: 1.2rem;
        max-width: 600px;
        margin: 0 auto;
        color: var(--text-muted);
        line-height: 1.6;
    }

    @media (max-width: 768px) {
        .hero h1 {
            font-size: 2.2rem;
        }
    }
</style>

<header class="hero">
    <!-- ID: title -->
    <h1>Titre Héroïque</h1>
    <!-- ID: description -->
    <p>Une description impactante qui donne envie de scroller.</p>
</header>
