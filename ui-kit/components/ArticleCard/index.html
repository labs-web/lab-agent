<!-- 
    ArticleCard Component
    Arguments:
        - title: string
        - date: string
        - excerpt: string
        - link: string
-->

<!-- Dependencies for Standalone Preview -->
<link rel="stylesheet" href="/ui-kit/base/variables.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* Demo Wrapper Style (Optional, just to ensure dark theme in preview) */
    body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-dark, #0f172a);
        /* Fallback if var not loaded */
        color: var(--text-main, #fff);
    }
</style>

<style>
    .article-card {
        background: var(--bg-card);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg);
        padding: var(--spacing-xl);
        transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(10px);
        height: 100%;
        /* Ensure font inheritance */
        font-family: inherit;
        color: inherit;
    }

    .article-card:hover {
        transform: translateY(-5px);
        background: var(--bg-card-hover);
        box-shadow: var(--shadow-soft);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .article-card h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: var(--spacing-sm);
        margin-top: 0;
    }

    .article-card h2 a {
        text-decoration: none;
        color: inherit;
        transition: color 0.3s ease;
    }

    .article-card h2 a:hover {
        color: var(--primary);
    }

    .article-card .meta {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: var(--spacing-md);
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }

    .article-card .meta::before {
        content: '';
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--accent);
    }

    .article-card p {
        color: var(--text-muted);
        margin-bottom: var(--spacing-md);
        flex-grow: 1;
        line-height: 1.6;
    }

    .article-card .read-more {
        margin-top: auto;
        display: inline-flex;
        align-items: center;
        color: var(--primary);
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
    }

    .article-card .read-more::after {
        content: '→';
        margin-left: 6px;
        transition: transform 0.2s ease;
    }

    .article-card .read-more:hover::after {
        transform: translateX(4px);
    }
</style>

<article class="article-card">
    <h2>
        <!-- ID: title -->
        <a href="#link">Titre de l'article</a>
    </h2>
    <div class="meta">
        <!-- ID: date -->
        <span>Publié le 01/01/2024</span>
    </div>
    <p>
        <!-- ID: excerpt -->
        Lorem ipsum dolor sit amet, consectetur adipiscing elit...
    </p>
    <!-- ID: link -->
    <a href="#link" class="read-more">Lire l'article</a>
</article>
