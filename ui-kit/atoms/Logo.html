<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Logo - Atom Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 600: '#4F46E5', 500: '#6366F1' },
                        slate: { 900: '#0F172A' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center space-y-12">

    <!-- Container 1: Light Mode / Default -->
    <div
        class="p-12 hover:bg-white rounded-3xl border border-transparent hover:border-slate-200 hover:shadow-xl transition-all duration-500 group">
        <div class="text-sm text-slate-400 mb-6 text-center font-mono opacity-50">Default (Light)</div>

        <!-- COMPONENT START : Logo -->
        <a href="#" class="flex items-center gap-2.5 group/logo cursor-pointer text-slate-900">
            <!-- Icon Mark -->
            <div class="relative w-10 h-10 flex items-center justify-center">
                <!-- Background Shape -->
                <div
                    class="absolute inset-0 bg-gradient-to-tr from-indigo-600 to-indigo-500 rounded-xl shadow-lg shadow-indigo-500/30 transform group-hover/logo:rotate-6 transition-transform duration-300">
                </div>
                <!-- Inner Graphic (Letter E) -->
                <svg class="relative w-5 h-5 text-white transform group-hover/logo:-rotate-3 transition-transform duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <!-- Simple Monogram E -->
                <span class="absolute text-white font-bold text-lg font-mono">E.</span>
            </div>

            <!-- Text Mark -->
            <div class="flex flex-col">
                <span
                    class="font-extrabold text-xl tracking-tight leading-none group-hover/logo:text-indigo-600 transition-colors">Essarraj</span>
                <span
                    class="text-[0.65rem] font-bold uppercase tracking-widest text-slate-400 group-hover/logo:text-indigo-400 transition-colors">Développeur</span>
            </div>
        </a>
        <!-- COMPONENT END -->

    </div>

    <!-- Container 2: Dark Mode Preview -->
    <div class="p-12 bg-slate-900 rounded-3xl shadow-2xl">
        <div class="text-sm text-slate-500 mb-6 text-center font-mono opacity-50">Dark Mode Optimized</div>

        <!-- COMPONENT COPY (Dark Mode simulation) -->
        <a href="#" class="flex items-center gap-2.5 group/logo cursor-pointer text-white">
            <div class="relative w-10 h-10 flex items-center justify-center">
                <div
                    class="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-xl shadow-lg shadow-indigo-500/20 transform group-hover/logo:rotate-6 transition-transform duration-300">
                </div>
                <span class="absolute text-white font-bold text-lg font-mono">E.</span>
            </div>
            <div class="flex flex-col">
                <span
                    class="font-extrabold text-xl tracking-tight leading-none group-hover/logo:text-indigo-400 transition-colors">Essarraj</span>
                <span
                    class="text-[0.65rem] font-bold uppercase tracking-widest text-slate-500 group-hover/logo:text-slate-300 transition-colors">Développeur</span>
            </div>
        </a>
    </div>

</body>

</html>
