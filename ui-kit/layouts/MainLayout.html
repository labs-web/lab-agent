<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Layout - Template</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 600: '#4F46E5', 800: '#3730A3' },
                        slate: { 50: '#F8FAFC', 900: '#0F172A' }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-gray-50 text-slate-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900 flex flex-col min-h-screen">

    <!-- Header / Navbar Area -->
    <!-- Note: In a real assembly, the Navbar component would be injected here -->
    <header class="fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <!-- Placeholder for Navbar -->
            <div
                class="w-full h-16 rounded-2xl border border-dashed border-indigo-300 bg-indigo-50/50 flex items-center justify-center text-sm font-mono text-indigo-500">
                [ Component: Navbar ]
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-32 pb-20 px-6">
        <div class="max-w-7xl mx-auto space-y-32">

            <!-- Hero Section Slot -->
            <section
                class="min-h-[60vh] rounded-3xl border-2 border-dashed border-slate-200 bg-white/50 flex items-center justify-center">
                <div class="text-center text-slate-400">
                    <p class="font-mono text-sm mb-2">[ Slot: Hero Section ]</p>
                    <p class="text-xs">Le contenu principal s'insère ici.</p>
                </div>
            </section>

            <!-- Example Content Section Slot -->
            <section
                class="h-96 rounded-3xl border-2 border-dashed border-slate-200 bg-white/50 flex items-center justify-center">
                <p class="font-mono text-sm text-slate-400">[ Slot: Projects / Skills ]</p>
            </section>

        </div>
    </main>

    <!-- Footer Area -->
    <footer class="bg-white border-t border-slate-100 py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-slate-500 text-sm">
                &copy; 2026 Portfolio Développeur. Tous droits réservés.
            </div>
            <div class="flex gap-6">
                <!-- Social Links Placeholders -->
                <div class="w-6 h-6 bg-slate-200 rounded-full"></div>
                <div class="w-6 h-6 bg-slate-200 rounded-full"></div>
                <div class="w-6 h-6 bg-slate-200 rounded-full"></div>
            </div>
        </div>
    </footer>

</body>

</html>
