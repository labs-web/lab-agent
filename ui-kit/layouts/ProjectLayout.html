<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Project Layout - Template</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter'] },
                    colors: {
                        indigo: { 600: '#4F46E5', 800: '#3730A3' },
                        slate: { 50: '#F8FAFC', 900: '#0F172A' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 text-slate-900 font-sans p-8">

    <!-- Template Context (Visualizing Grid) -->
    <div class="max-w-7xl mx-auto space-y-8">

        <header class="text-center mb-16">
            <h2 class="text-3xl font-bold mb-4">Mes Réalisations</h2>
            <p class="text-slate-500 max-w-2xl mx-auto">
                Une sélection de projets techniques mettant en œuvre l'écosystème Laravel.
            </p>
        </header>

        <!-- Project Grid Layout -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

            <!-- Slot [1] -->
            <div
                class="aspect-[4/5] rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/30 flex items-center justify-center text-indigo-400 font-mono text-sm">
                [ Component: ProjectCard ]
            </div>

            <!-- Slot [2] -->
            <div
                class="aspect-[4/5] rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/30 flex items-center justify-center text-indigo-400 font-mono text-sm">
                [ Component: ProjectCard ]
            </div>

            <!-- Slot [3] -->
            <div
                class="aspect-[4/5] rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/30 flex items-center justify-center text-indigo-400 font-mono text-sm">
                [ Component: ProjectCard ]
            </div>

        </div>

        <div class="mt-12 text-center">
            <button
                class="px-6 py-3 border border-slate-200 rounded-xl text-slate-600 hover:border-indigo-600 hover:text-indigo-600 transition-colors">
                Voir tous les projets
            </button>
        </div>

    </div>

</body>

</html>
