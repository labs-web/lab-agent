<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter'] }, colors: { indigo: { 600: '#4F46E5', 800: '#3730A3' } } } } }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 flex flex-col">
        <div class="p-6 border-b border-gray-100">
            <h1 class="text-xl font-bold text-gray-900">UI Kit <span class="text-indigo-600">.</span></h1>
            <p class="text-xs text-gray-500 mt-1">Portfolio Laravel Dev</p>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-6">

            <!-- Category: Charte -->
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">Fondations</h3>
                <ul class="space-y-1">
                    <li>
                        <button onclick="loadComponent('charte-graphique/index.html', 'Charte Graphique')"
                            class="w-full text-left px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-indigo-600 rounded-md transition-colors">
                            Charte Graphique
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Category: Atoms -->
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">Atoms</h3>
                <ul class="space-y-1">
                    <li>
                        <button onclick="loadComponent('atoms/SkillBadge.html', 'SkillBadge')"
                            class="w-full text-left px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-indigo-600 rounded-md transition-colors">
                            SkillBadge
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Category: Molecules -->
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">Molecules</h3>
                <ul class="space-y-1">
                    <li>
                        <button onclick="loadComponent('molecules/ProjectCard.html', 'ProjectCard')"
                            class="w-full text-left px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-indigo-600 rounded-md transition-colors">
                            ProjectCard
                        </button>
                    </li>
                    <li>
                        <button onclick="loadComponent('molecules/ContactForm.html', 'ContactForm')"
                            class="w-full text-left px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-indigo-600 rounded-md transition-colors">
                            ContactForm
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Category: Layouts -->
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">Layouts</h3>
                <ul class="space-y-1">
                    <li>
                        <button onclick="loadComponent('layouts/Hero.html', 'Hero')"
                            class="w-full text-left px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-50 hover:text-indigo-600 rounded-md transition-colors">
                            Hero Section
                        </button>
                    </li>
                </ul>
            </div>

        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Toolbar -->
        <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center z-10">
            <h2 id="componentTitle" class="text-sm font-semibold text-gray-700">Sélectionnez un composant</h2>
            <a id="openLink" href="#" target="_blank"
                class="text-xs font-medium text-indigo-600 hover:text-indigo-800 flex items-center gap-1 opacity-50 pointer-events-none transition-opacity">
                Ouvrir dans un nouvel onglet
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
            </a>
        </header>

        <!-- Preview Area -->
        <div class="flex-1 bg-gray-100 p-8 overflow-hidden relative">
            <div class="w-full h-full bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden relative">
                <iframe id="previewFrame" class="w-full h-full border-none" src="about:blank"></iframe>
            </div>
        </div>
    </main>

    <script>
        function loadComponent(path, title) {
            document.getElementById('previewFrame').src = path;
            document.getElementById('componentTitle').innerText = title;

            const link = document.getElementById('openLink');
            link.href = path;
            link.classList.remove('opacity-50', 'pointer-events-none');
        }
    </script>
</body>

</html>
