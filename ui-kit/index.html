<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit - Galerie des Composants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-gray-900 text-white flex">

    <!-- ==================== SIDEBAR MENU ==================== -->
    <aside class="w-72 bg-gray-800 border-r border-gray-700 flex flex-col h-screen sticky top-0">
        <!-- Header -->
        <div class="p-6 border-b border-gray-700">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <span class="text-white font-bold">UI</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold">UI Kit</h1>
                    <p class="text-xs text-gray-400">Galerie Composants</p>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto p-4">
            <!-- Charte Graphique -->
            <div class="mb-6">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-3">Charte Graphique</h2>
                <button onclick="loadComponent('./charte-graphique/index.html', 'Charte Graphique')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-all">
                    <span class="w-2 h-2 bg-pink-500 rounded-full"></span>
                    Démonstration
                </button>
            </div>

            <!-- Molecules -->
            <div class="mb-6">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-3">Molecules</h2>
                <button onclick="loadComponent('./molecules/Header.html', 'Header')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-all">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                    Header
                </button>
                <button onclick="loadComponent('./molecules/Footer.html', 'Footer')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-all">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                    Footer
                </button>
                <button onclick="loadComponent('./molecules/ArticleCard.html', 'ArticleCard')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-all">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                    ArticleCard
                </button>
            </div>

            <!-- Layouts -->
            <div class="mb-6">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-3">Layouts</h2>
                <button onclick="loadComponent('./layouts/LayoutPublic.html', 'LayoutPublic')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-all">
                    <span class="w-2 h-2 bg-amber-500 rounded-full"></span>
                    LayoutPublic
                </button>
            </div>

            <!-- Pages -->
            <div class="mb-6">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-3">Pages</h2>
                <button onclick="loadComponent('./pages/PageListeArticles.html', 'PageListeArticles')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-all">
                    <span class="w-2 h-2 bg-purple-500 rounded-full"></span>
                    PageListeArticles
                </button>
            </div>
        </nav>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-700 text-center text-xs text-gray-500">
            UI Kit v1.0
        </div>
    </aside>
    <!-- ==================== END SIDEBAR ==================== -->

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="flex-1 flex flex-col h-screen">
        <!-- Toolbar -->
        <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
            <div>
                <h2 id="component-title" class="text-xl font-bold">PageListeArticles</h2>
                <p id="component-path" class="text-sm text-gray-400">./pages/PageListeArticles.html</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openInNewTab()"
                    class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-sm rounded-lg transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                    Ouvrir
                </button>
            </div>
        </header>

        <!-- Iframe Container -->
        <div class="flex-1 bg-white">
            <iframe id="preview-frame" src="./pages/PageListeArticles.html" class="w-full h-full border-0"></iframe>
        </div>
    </main>
    <!-- ==================== END MAIN ==================== -->

    <script>
        let currentPath = './pages/PageListeArticles.html';

        function loadComponent(path, title) {
            currentPath = path;
            document.getElementById('preview-frame').src = path;
            document.getElementById('component-title').textContent = title;
            document.getElementById('component-path').textContent = path;

            // Update active state
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('bg-gray-700', 'text-white');
                btn.classList.add('text-gray-300');
            });
            event.currentTarget.classList.add('bg-gray-700', 'text-white');
            event.currentTarget.classList.remove('text-gray-300');
        }

        function openInNewTab() {
            window.open(currentPath, '_blank');
        }

        // Set initial active state
        document.addEventListener('DOMContentLoaded', () => {
            const lastBtn = document.querySelector('.nav-item:last-of-type');
            if (lastBtn) {
                lastBtn.classList.add('bg-gray-700', 'text-white');
                lastBtn.classList.remove('text-gray-300');
            }
        });
    </script>

</body>

</html>
